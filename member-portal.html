<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUMLHS Member Portal</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#071b36,#0c3760);color:#17243b;min-height:100vh;display:grid;place-items:center;padding:22px}.shell{width:min(100%,980px);background:#f6f8fb;border-radius:26px;overflow:hidden;box-shadow:0 25px 80px #0005}.top{background:#102c4c;color:white;padding:28px 34px;display:flex;gap:16px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:#e6b655;display:grid;place-items:center;color:#102c4c;font-weight:900;font-size:20px}.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0;color:#c7d9ee}.main{padding:30px}.panel{background:white;border:1px solid #e1e8f1;border-radius:18px;padding:24px;max-width:520px;margin:auto}.panel h2{margin-top:0}.input{width:100%;padding:13px 14px;border:1px solid #cdd8e4;border-radius:10px;margin:8px 0;font-size:16px}.btn{background:#12385e;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;margin-top:8px}.btn.secondary{background:#e9eff6;color:#173651}.muted{color:#63748a;font-size:13px}.msg{margin:12px 0;color:#b33;font-size:14px}.hide{display:none}.profile{max-width:800px;margin:auto}.hero{display:flex;gap:22px;align-items:center;background:#fff;padding:24px;border-radius:18px;border:1px solid #e0e8f0}.photo{width:128px;height:128px;border-radius:24px;object-fit:cover;background:#dce5ee}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.item{background:white;padding:15px;border:1px solid #e0e8f0;border-radius:12px}.item small{display:block;color:#697b90;margin-bottom:5px}.item input,.item textarea{width:100%;border:0;border-bottom:1px solid #d7e0ea;padding:7px 0;font-size:15px;background:transparent}.item.lock{background:#f1f4f8}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{color:#18774a}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{border:0;border-radius:9px;padding:10px 13px;background:#e2eaf3;cursor:pointer}@media(max-width:600px){.top{padding:20px}.main{padding:16px}.hero{flex-direction:column;text-align:center}.grid{grid-template-columns:1fr}.top h1{font-size:19px}}
</style></head><body><div class="shell"><header class="top"><div class="logo">MU</div><div><h1>MUMLHS Alumni Member Portal</h1><p>SSC 2013 • Golden Jubilee Reunion · Private Member Access</p></div></header><main class="main"><section id="auth" class="panel"><h2 id="authTitle">Member Login</h2><p class="muted">Your personal profile is accessible only after authentication.</p><div id="loginForm"><input class="input" id="uid" placeholder="Event ID / Unique ID"><input class="input" id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Sign in</button><div class="actions"><button class="btn secondary" onclick="showActivate()">First-time activation</button><button class="btn secondary" onclick="showReset()">Forgot password</button></div></div><div id="flow" class="hide"><input class="input" id="fuid" placeholder="Event ID / Unique ID"><input class="input" id="email" type="email" placeholder="Registered email"><button class="btn secondary" onclick="sendCode()">Send verification code</button><input class="input hide" id="otp" placeholder="6-digit email code"><input class="input hide" id="newpass" type="password" placeholder="Create password (10+ characters)"><button class="btn hide" id="finish" onclick="finishActivation()">Verify & set password</button></div><div id="msg" class="msg"></div></section><section id="dash" class="profile hide"><div class="hero"><img id="photo" class="photo"><div><h2 id="name"></h2><p id="uidLabel" class="status"></p><p class="muted">Personal Alumni Profile</p><button class="btn secondary" onclick="logout()">Log out</button></div></div><div class="grid" id="fields"></div><div class="actions"><button class="btn" onclick="saveProfile()">Save profile changes</button><button class="btn secondary" onclick="changePassUI()">Change password</button></div><div id="dashMsg" class="msg"></div><div id="passBox" class="hide"><input class="input" id="oldpass" type="password" placeholder="Current password"><input class="input" id="newpass2" type="password" placeholder="New password (10+ characters)"><button class="btn" onclick="changePass()">Update password</button></div></section></main></div><iframe name="bridge" id="bridge" style="display:none"></iframe><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbx2IKfYnYR5iTr5AxUdMPu0lG0ZhoSSRo6ymFnEqwm7wwmb_kmP4OOJMpIujAKA9Qst/exec'; // configure after deploying Apps Scriptlet token='',mode='activate',requestId=0,waiting={};function call(payload){return new Promise((resolve,reject)=>{let id='r'+(++requestId);waiting[id]=resolve;let f=document.createElement('form');f.method='POST';f.action=ENDPOINT;f.target='bridge';f.style.display='none';[['responseMode','postMessage'],['action','memberPortal'],['requestId',id],['payload',JSON.stringify(payload)]].forEach(([k,v])=>{let i=document.createElement('input');i.name=k;i.value=v;f.append(i)});document.body.append(f);f.submit();f.remove();setTimeout(()=>{if(waiting[id]){delete waiting[id];reject(new Error('Request timeout. Check deployment.'))}},20000)})}window.addEventListener('message',e=>{if(e.data&&e.data.__muhsMemberResponse&&waiting[e.data.requestId]){waiting[e.data.requestId](e.data.payload);delete waiting[e.data.requestId]}});function msg(t){document.getElementById('msg').textContent=t}function showActivate(){mode='activate';document.getElementById('authTitle').textContent='Account Activation';document.getElementById('loginForm').classList.add('hide');document.getElementById('flow').classList.remove('hide');msg('Enter Event ID and registered email to verify your account.')}function showReset(){mode='resetPassword';showActivate();document.getElementById('authTitle').textContent='Password Recovery'}async function sendCode(){let uid=document.getElementById('fuid').value.trim(),email=document.getElementById('email').value.trim();try{let r=await call({action:mode==='resetPassword'?'resetOtp':'otp',uid,email});if(!r.success){msg(r.error||'Could not send code');return}document.getElementById('otp').classList.remove('hide');document.getElementById('newpass').classList.remove('hide');document.getElementById('finish').classList.remove('hide');msg('Verification code sent to your registered email.')}catch(e){msg(e.message)}}async function finishActivation(){try{let r=await call({action:mode,uid:document.getElementById('fuid').value.trim(),email:document.getElementById('email').value.trim(),otp:document.getElementById('otp').value.trim(),password:document.getElementById('newpass').value});if(r.success){msg('Password set. Please login.');document.getElementById('flow').classList.add('hide');document.getElementById('loginForm').classList.remove('hide');document.getElementById('uid').value=document.getElementById('fuid').value}else msg(r.error||'Verification failed')}catch(e){msg(e.message)}}async function login(){try{let r=await call({action:'login',uid:document.getElementById('uid').value.trim(),password:document.getElementById('password').value});if(!r.success){msg(r.error==='credentials'?'Incorrect ID or password':r.error==='locked'?'Temporarily locked after repeated failures':r.error==='not_activated'?'Activate your account first':r.error);return}token=r.token;document.getElementById('auth').classList.add('hide');document.getElementById('dash').classList.remove('hide');loadProfile()}catch(e){msg(e.message)}}async function loadProfile(){let r=await call({action:'profile',token});if(!r.success){document.getElementById('dashMsg').textContent=r.error;return}let p=r.profile;document.getElementById('name').textContent=p.Name||'Member';document.getElementById('uidLabel').textContent=p.UniqueID;document.getElementById('photo').src=p.PhotoURL||'https://placehold.co/128x128?text=Member';let defs=[['Name',p.Name,false],['Event ID',p.UniqueID,false],['Phone',p.Phone,false],['Email',p.Email,false],['PhotoURL',p.PhotoURL,true],['BloodGroup',p.BloodGroup,true],['CurrentAddress',p.CurrentAddress,true],['PermanentAddress',p.PermanentAddress,true],['Profession',p.Profession,true],['About',p.About,true]];let container=document.getElementById('fields');container.innerHTML='';defs.forEach(([k,v,edit])=>{let d=document.createElement('div');d.className='item'+(edit?'':' lock');let label=k.replace(/([A-Z])/g,' $1').trim();d.innerHTML='<small>'+label+(edit?' • Editable':' • Locked')+'</small>';let inp=document.createElement(edit&&k==='About'?'textarea':'input');inp.value=v||'';inp.dataset.key=k;if(!edit){inp.disabled=true}d.append(inp);container.append(d)})}async function saveProfile(){let changes={};document.querySelectorAll('#fields input:not(:disabled),#fields textarea').forEach(i=>changes[i.dataset.key]=i.value);try{let r=await call({action:'update',token,changes});document.getElementById('dashMsg').textContent=r.success?'Profile updated successfully.':r.error; if(r.success)loadProfile()}catch(e){document.getElementById('dashMsg').textContent=e.message}}function changePassUI(){document.getElementById('passBox').classList.toggle('hide')}async function changePass(){try{let r=await call({action:'changePassword',token,oldPassword:document.getElementById('oldpass').value,newPassword:document.getElementById('newpass2').value});document.getElementById('dashMsg').textContent=r.success?'Password updated.':r.error}catch(e){document.getElementById('dashMsg').textContent=e.message}}async function logout(){try{await call({action:'logout',token})}catch(e){}token='';location.reload()}
</script></body></html>
